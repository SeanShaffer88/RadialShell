name: Windows executable

on:
  push:
    branches:
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a portable ZIP and GitHub release for the supplied version
        required: true
        default: false
        type: boolean
      version:
        description: Semantic release version, without the v prefix
        required: false
        type: string

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x

jobs:
  build-and-test:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build solution
        run: dotnet build .\RadialShell.sln --configuration Release

      - name: Run target policy tests
        run: dotnet run --project .\tests\RadialShell.Core.Tests\RadialShell.Core.Tests.csproj --configuration Release

      - name: Publish self-contained Windows executable
        run: >-
          dotnet publish .\src\RadialShell.App\RadialShell.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=false
          --output .\artifacts\RadialShell-win-x64

      - name: Smoke-test executable
        run: .\artifacts\RadialShell-win-x64\RadialShell.exe --self-test

      - name: Verify local structured log
        shell: pwsh
        run: |
          $log = '.\artifacts\RadialShell-win-x64\data\logs\radialshell.jsonl'
          if (!(Test-Path $log)) { throw 'JSONL log was not created.' }
          $entries = Get-Content $log | ForEach-Object { $_ | ConvertFrom-Json }
          $entry = $entries | Where-Object { $_.event -eq 'self_test.logger' } | Select-Object -Last 1
          if ($null -eq $entry -or $entry.level -ne 'INFO' -or !$entry.timestampUtc) {
            throw 'Expected structured logger smoke-test entry was not found.'
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = '.\artifacts\RadialShell-win-x64\RadialShell.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RadialShell.exe" | Set-Content "$exe.sha256" -Encoding ascii

      - name: Create portable release package
        id: package
        shell: pwsh
        run: |
          [xml]$project = Get-Content '.\src\RadialShell.App\RadialShell.App.csproj' -Raw
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid project release version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

          $source = '.\artifacts\RadialShell-win-x64'
          $payload = Join-Path $PWD 'artifacts\portable-stage\RadialShell'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Get-ChildItem -LiteralPath $source -Force |
            Where-Object { $_.Name -ne 'data' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $payload -Recurse -Force }
          Copy-Item '.\README.md' $payload
          Copy-Item '.\LICENSE' $payload

          $zipName = "RadialShell-v$version-x64-Portable.zip"
          $zipPath = Join-Path $PWD "artifacts\$zipName"
          Compress-Archive -Path $payload -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content '.\artifacts\SHA256SUMS.txt' -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RadialShell-win-x64
          path: |
            .\artifacts\RadialShell-win-x64\RadialShell.exe
            .\artifacts\RadialShell-win-x64\RadialShell.exe.sha256
            .\artifacts\RadialShell-v*-x64-Portable.zip
            .\artifacts\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/') && github.event.head_commit.message == 'Release v1.0.0')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged release assets
        uses: actions/download-artifact@v4
        with:
          name: RadialShell-win-x64
          path: release-assets

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PROJECT_VERSION: ${{ needs.build-and-test.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ($env:REF_NAME -match '^v') { $version = $env:REF_NAME -replace '^v', '' }
            else { $version = $env:PROJECT_VERSION }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Supply a semantic version such as 1.0.0, without a v prefix.'
          }
          if ($version -ne $env:PROJECT_VERSION) {
            throw "Requested version $version does not match project version $env:PROJECT_VERSION."
          }
          $tag = "v$version"
          if ($env:REF_NAME -match '^v' -and $env:REF_NAME -ne $tag) {
            throw "Pushed tag $env:REF_NAME does not match expected tag $tag."
          }

          $zipName = "RadialShell-$tag-x64-Portable.zip"
          $zip = Get-ChildItem -LiteralPath 'release-assets' -Recurse -File -Filter $zipName | Select-Object -First 1
          $checksums = Get-ChildItem -LiteralPath 'release-assets' -Recurse -File -Filter 'SHA256SUMS.txt' | Select-Object -First 1
          if ($null -eq $zip -or $null -eq $checksums) { throw 'Release assets are incomplete.' }
          $checksumLine = Get-Content -LiteralPath $checksums.FullName | Where-Object { $_ -match [regex]::Escape($zipName) } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($checksumLine)) { throw 'SHA256SUMS.txt does not list the portable archive.' }
          $expectedHash = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) { throw 'Portable archive checksum verification failed.' }

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            gh release create $tag $zip.FullName $checksums.FullName --target $env:TARGET_SHA --title "RadialShell $tag" --notes 'Self-contained x64 portable release. This build is unsigned. Verify the archive with SHA256SUMS.txt.'
          }
          else {
            gh release create $tag $zip.FullName $checksums.FullName --verify-tag --title "RadialShell $tag" --notes 'Self-contained x64 portable release. This build is unsigned. Verify the archive with SHA256SUMS.txt.'
          }
