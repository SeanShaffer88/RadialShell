name: Windows release

on:
  push:
    branches:
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish x64 installers, a portable ZIP, and a GitHub release for the supplied version
        required: true
        default: false
        type: boolean
      version:
        description: Semantic release version, without the v prefix
        required: false
        type: string

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x

jobs:
  build-and-test:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build solution
        run: dotnet build .\RadialShell.sln --configuration Release

      - name: Run target policy tests
        run: dotnet run --project .\tests\RadialShell.Core.Tests\RadialShell.Core.Tests.csproj --configuration Release

      - name: Publish self-contained Windows executable
        run: >-
          dotnet publish .\src\RadialShell.App\RadialShell.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=false
          --output .\artifacts\RadialShell-win-x64

      - name: Smoke-test executable
        run: .\artifacts\RadialShell-win-x64\RadialShell.exe --self-test

      - name: Verify local structured log
        shell: pwsh
        run: |
          $log = '.\artifacts\RadialShell-win-x64\data\logs\radialshell.jsonl'
          if (!(Test-Path $log)) { throw 'JSONL log was not created.' }
          $entries = Get-Content $log | ForEach-Object { $_ | ConvertFrom-Json }
          $entry = $entries | Where-Object { $_.event -eq 'self_test.logger' } | Select-Object -Last 1
          if ($null -eq $entry -or $entry.level -ne 'INFO' -or !$entry.timestampUtc) {
            throw 'Expected structured logger smoke-test entry was not found.'
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = '.\artifacts\RadialShell-win-x64\RadialShell.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RadialShell.exe" | Set-Content "$exe.sha256" -Encoding ascii

      - name: Create portable release package
        id: package
        shell: pwsh
        run: |
          [xml]$project = Get-Content '.\src\RadialShell.App\RadialShell.App.csproj' -Raw
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid project release version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

          $source = '.\artifacts\RadialShell-win-x64'
          $payload = Join-Path $PWD 'artifacts\portable-stage\RadialShell'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Get-ChildItem -LiteralPath $source -Force |
            Where-Object { $_.Name -ne 'data' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $payload -Recurse -Force }
          Copy-Item '.\README.md' $payload
          Copy-Item '.\LICENSE' $payload

          $zipName = "RadialShell-v$version-x64-Portable.zip"
          $zipPath = Join-Path $PWD "artifacts\$zipName"
          Compress-Archive -Path $payload -DestinationPath $zipPath -CompressionLevel Optimal -Force

      - name: Stage installer files
        shell: pwsh
        run: |
          $source = '.\artifacts\RadialShell-win-x64'
          $installSource = Join-Path $PWD 'artifacts\installer-stage'
          New-Item -ItemType Directory -Path $installSource -Force | Out-Null
          Get-ChildItem -LiteralPath $source -Force |
            Where-Object { $_.Name -ne 'data' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $installSource -Recurse -Force }
          Copy-Item '.\README.md' $installSource
          Copy-Item '.\LICENSE' $installSource

      - name: Install pinned WiX toolchain
        shell: pwsh
        env:
          WIX_VERSION: 5.0.2
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned WiX CLI.' }
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          if (!(Test-Path $wix)) { throw 'WiX CLI was not installed.' }
          & $wix extension add "WixToolset.Bal.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the WiX Burn extension.' }

      - name: Build x64 per-user MSI
        shell: pwsh
        env:
          PROJECT_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $version = $env:PROJECT_VERSION
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          $publishDir = [IO.Path]::GetFullPath((Join-Path $PWD 'artifacts\installer-stage'))
          $msiPath = Join-Path $PWD "artifacts\RadialShell-v$version-x64.msi"
          & $wix build '.\packaging\installer\Product.wxs' -arch x64 -d "Version=$version" -d "PublishDir=$publishDir" -o $msiPath
          if ($LASTEXITCODE -ne 0) { throw 'WiX failed to build the per-user MSI.' }

      - name: Build x64 Setup EXE
        shell: pwsh
        env:
          PROJECT_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $version = $env:PROJECT_VERSION
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          $msiPath = Join-Path $PWD "artifacts\RadialShell-v$version-x64.msi"
          $setupPath = Join-Path $PWD "artifacts\RadialShell-v$version-x64-Setup.exe"
          & $wix build '.\packaging\installer\Bundle.wxs' -arch x64 -ext WixToolset.Bal.wixext -d "Version=$version" -d "MsiPath=$msiPath" -o $setupPath
          if ($LASTEXITCODE -ne 0) { throw 'WiX failed to build the Setup EXE.' }

      - name: Smoke-test per-user Setup EXE installation
        shell: pwsh
        env:
          PROJECT_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $version = $env:PROJECT_VERSION
          $setupPath = Join-Path $PWD "artifacts\RadialShell-v$version-x64-Setup.exe"
          $msiPath = Join-Path $PWD "artifacts\RadialShell-v$version-x64.msi"
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\RadialShell'
          $installedExe = Join-Path $installRoot 'RadialShell.exe'
          $setupInstall = Start-Process -FilePath $setupPath -ArgumentList '/quiet /norestart' -Wait -PassThru
          if ($setupInstall.ExitCode -notin @(0, 3010) -or !(Test-Path $installedExe)) {
            throw "Setup EXE per-user installation failed with exit code $($setupInstall.ExitCode)."
          }
          & $installedExe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed.' }
          $uninstallArgs = "/x `"$msiPath`" /qn /norestart"
          $uninstall = Start-Process -FilePath 'msiexec.exe' -ArgumentList $uninstallArgs -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010) -or (Test-Path $installedExe)) {
            throw "Setup EXE uninstall failed with exit code $($uninstall.ExitCode)."
          }
          if (!(Test-Path (Join-Path $installRoot 'data\logs\radialshell.jsonl'))) {
            throw 'Uninstall did not preserve adjacent user data.'
          }

      - name: Smoke-test per-user MSI installation
        shell: pwsh
        env:
          PROJECT_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $version = $env:PROJECT_VERSION
          $msiPath = Join-Path $PWD "artifacts\RadialShell-v$version-x64.msi"
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\RadialShell'
          $installedExe = Join-Path $installRoot 'RadialShell.exe'
          $installArgs = "/i `"$msiPath`" /qn /norestart"
          $install = Start-Process -FilePath 'msiexec.exe' -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010) -or !(Test-Path $installedExe)) {
            throw "MSI per-user installation failed with exit code $($install.ExitCode)."
          }
          $uninstallArgs = "/x `"$msiPath`" /qn /norestart"
          $uninstall = Start-Process -FilePath 'msiexec.exe' -ArgumentList $uninstallArgs -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010) -or (Test-Path $installedExe)) {
            throw "MSI uninstall failed with exit code $($uninstall.ExitCode)."
          }

      - name: Generate release asset checksums
        shell: pwsh
        env:
          PROJECT_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $version = $env:PROJECT_VERSION
          $assetPaths = @(
            (Join-Path $PWD "artifacts\RadialShell-v$version-x64-Portable.zip"),
            (Join-Path $PWD "artifacts\RadialShell-v$version-x64.msi"),
            (Join-Path $PWD "artifacts\RadialShell-v$version-x64-Setup.exe")
          )
          $manifest = foreach ($path in ($assetPaths | Sort-Object)) {
            $file = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $manifest | Set-Content '.\artifacts\SHA256SUMS.txt' -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RadialShell-win-x64
          path: |
            .\artifacts\RadialShell-win-x64\RadialShell.exe
            .\artifacts\RadialShell-win-x64\RadialShell.exe.sha256
            .\artifacts\RadialShell-v*-x64-Portable.zip
            .\artifacts\RadialShell-v*-x64-Setup.exe
            .\artifacts\RadialShell-v*-x64.msi
            .\artifacts\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/') && startsWith(github.event.head_commit.message, 'Release v1.0.0'))
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged release assets
        uses: actions/download-artifact@v4
        with:
          name: RadialShell-win-x64
          path: release-assets

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          PROJECT_VERSION: ${{ needs.build-and-test.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ($env:REF_NAME -match '^v') { $version = $env:REF_NAME -replace '^v', '' }
            else { $version = $env:PROJECT_VERSION }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Supply a semantic version such as 1.0.0, without a v prefix.'
          }
          if ($version -ne $env:PROJECT_VERSION) {
            throw "Requested version $version does not match project version $env:PROJECT_VERSION."
          }
          $tag = "v$version"
          if ($env:REF_NAME -match '^v' -and $env:REF_NAME -ne $tag) {
            throw "Pushed tag $env:REF_NAME does not match expected tag $tag."
          }

          $expectedNames = @(
            "RadialShell-$tag-x64-Setup.exe",
            "RadialShell-$tag-x64.msi",
            "RadialShell-$tag-x64-Portable.zip",
            'SHA256SUMS.txt'
          )
          $assets = foreach ($name in $expectedNames) {
            $asset = Get-ChildItem -LiteralPath 'release-assets' -Recurse -File -Filter $name | Select-Object -First 1
            if ($null -eq $asset) { throw "Release asset is missing: $name" }
            $asset
          }
          $checksums = $assets | Where-Object { $_.Name -eq 'SHA256SUMS.txt' } | Select-Object -First 1
          $manifestLines = Get-Content -LiteralPath $checksums.FullName
          foreach ($asset in ($assets | Where-Object { $_.Name -ne 'SHA256SUMS.txt' })) {
            $checksumLine = $manifestLines | Where-Object { $_ -match ('\s{2}' + [regex]::Escape($asset.Name) + '$') } | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($checksumLine)) { throw "SHA256SUMS.txt does not list $($asset.Name)." }
            $expectedHash = ($checksumLine -split '\s+')[0].ToLowerInvariant()
            $actualHash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expectedHash -ne $actualHash) { throw "Checksum verification failed for $($asset.Name)." }
          }

          $payloads = $assets | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName }
          $payloads += $checksums.FullName
          $notes = 'Self-contained x64 release. Setup EXE and MSI install per-user under %LOCALAPPDATA%\Programs\RadialShell without elevation or external runtime prerequisites. No startup behavior is configured. Verify all package assets with SHA256SUMS.txt. This build is unsigned.'
          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            $uploadArgs = @('release', 'upload', $tag) + $payloads + @('--clobber')
            gh @uploadArgs
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload the validated assets to the existing GitHub release.' }
            gh release edit $tag --title "RadialShell $tag" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the GitHub release notes.' }
          }
          elseif ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $createArgs = @('release', 'create', $tag) + $payloads + @('--target', $env:TARGET_SHA, '--title', "RadialShell $tag", '--notes', $notes)
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the GitHub release.' }
          }
          else {
            $createArgs = @('release', 'create', $tag) + $payloads + @('--verify-tag', '--title', "RadialShell $tag", '--notes', $notes)
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the GitHub release.' }
          }
